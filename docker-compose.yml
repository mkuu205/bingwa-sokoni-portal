services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bingwa_portal
      POSTGRES_USER: bingwa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - bingwa_portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingwa -d bingwa_portal"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  bingwa_portal_pgdata:
