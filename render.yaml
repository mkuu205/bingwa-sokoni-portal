services:
  - type: web
    name: bingwa-sokoni-portal-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:deploy && npm run start -w apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: kish
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PAIRING_CODE_PEPPER
        sync: false
      - key: WEB_ORIGIN
        value: https://portal.bingwasokoni.top
      - key: PORT
        value: 4000
